server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS before this container. Keep directory-slash
    # redirects relative so Nginx never downgrades a public HTTPS request.
    absolute_redirect off;

    # Consent controls must never be embedded in a third-party frame. The
    # frame-ancestors directive is ignored in a meta CSP, so it belongs here.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Static assets caching
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The workload Worker is network-sterile even if its source changes later.
    # Worker execution policy comes from the Worker response, not the page meta CSP.
    location = /js/333-compute-worker.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'none'; script-src 'none'; worker-src 'none'" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # JSON API
    location /api/ {
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Semantic Web
    location /ontology.ttl {
        add_header Content-Type "text/turtle; charset=utf-8";
    }

    location /llms.txt {
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/turtle;
    gzip_min_length 256;
}
