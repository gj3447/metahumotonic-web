  <circle cx="16" cy="16" r="12" fill="url(#g1)"/>
  <circle cx="48" cy="16" r="12" fill="url(#g2)"/>
  <circle cx="16" cy="48" r="12" fill="url(#g3)"/>
  <circle cx="48" cy="48" r="12" fill="url(#g4)"/>
