<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- metahumotonic 정전 심볼 — 2x2 그리드 4 형광 그라데이션 원형 -->
  <!-- KG: MetaHumotonicSymbol id=metahumotonic-symbol-2x2-fluorescent-2026-05-22 -->
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="75%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#d946a1"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5f5dc"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="65%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </radialGradient>
