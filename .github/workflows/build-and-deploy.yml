name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: metahumotonic-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify consent and surface contracts
        run: npm run test:release

      # ooptdd 측정층 — 빌드 산출물(dist/)을 읽어back 해 KG 실물 착지를 positive-assert.
      # GENERATOR(Node) → build-trace.jsonl → VERIFIER(Python ooptdd). RED 면 배포 안 함.
      - name: Emit ooptdd build-trace (측정 GENERATOR)
        run: node scripts/ooptdd/emit-build-trace.mjs

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Verify build-trace gate (측정 VERIFIER — silent gap이면 RED)
        run: uv run --python 3.12 --with pyyaml python scripts/ooptdd/verify-build-trace.py

      - name: Pack the combined site
        run: |
          tar -czf dist.tar.gz -C dist .
          ls -lh dist.tar.gz

      - name: Upload staged site
        uses: actions/upload-artifact@v4
        with:
          name: metahumotonic-site-${{ github.sha }}
          path: dist.tar.gz
          retention-days: 14

      - name: Setup kubectl (client-only, for manifest generation)
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Generate ConfigMap manifest
        run: |
          mkdir -p deploy-out
          kubectl create configmap landing-astro-dist \
            --namespace=infra \
            --from-file=dist.tar.gz=dist.tar.gz \
            --dry-run=client -o yaml \
            | sed '/^  creationTimestamp:/d' > deploy-out/cm.yaml
          cp dist.tar.gz deploy-out/dist.tar.gz
          cp -f .github/deploy-readme.md deploy-out/README.md 2>/dev/null || true
          ls -la deploy-out/

      - name: Push to deploy branch
        if: ${{ vars.METAHUMOTONIC_SURFACE_CUTOVER == 'path-live' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd deploy-out
          git init -b deploy
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7} (build #${GITHUB_RUN_NUMBER})"
          git push -f origin deploy

      - name: Hold production cutover
        if: ${{ vars.METAHUMOTONIC_SURFACE_CUTOVER != 'path-live' }}
        run: echo "Combined artifact validated; deploy held until METAHUMOTONIC_SURFACE_CUTOVER=path-live."
